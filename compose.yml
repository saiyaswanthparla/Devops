services:
  webapp:
    build:
      context: .
      args:
        VITE_APP_ENV : ${VITE_APP_ENV}
    image: react-app:${IMAGE_TAG}
    ports:
      - "${HOST_PORT}:80"
    env_file:
      - app.env
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy
  api:
    image: nginx:alpine
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - app-data:/data
volumes:
  app-data:
