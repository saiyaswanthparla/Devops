name: React Application Build and EC2 Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build React Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Display environment information
        run: |
          pwd
          node --version
          npm --version
          ls -la

      - name: Verify project files
        run: |
          test -f package.json || {
            echo "::error::package.json was not found"
            exit 1
          }

          test -f package-lock.json || {
            echo "::error::package-lock.json was not found"
            exit 1
          }

          echo "Required project files are present"

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build

      - name: Verify build output
        run: |
          test -d dist || {
            echo "::error::dist directory was not created"
            exit 1
          }

          test -f dist/index.html || {
            echo "::error::dist/index.html was not created"
            exit 1
          }

          echo "React build verified successfully"
          find dist -maxdepth 2 -type f -print

      - name: Upload React build artifact
        uses: actions/upload-artifact@v7
        with:
          name: react-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy React Application to EC2
    runs-on: ubuntu-latest
    needs: build

    env:
      ARCHIVE_ROOT: ${{ vars.EC2_ARCHIVE_ROOT }}
      STAGING_ROOT: ${{ vars.EC2_STAGING_ROOT }}
      DESTINATION_PATH: ${{ vars.EC2_DESTINATION }}
      BACKUP_ROOT: ${{ vars.EC2_BACKUP_ROOT }}

    steps:
      - name: Download React build artifact
        uses: actions/download-artifact@v8
        with:
          name: react-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: downloaded-build

      - name: Verify downloaded artifact
        run: |
          test -d downloaded-build || {
            echo "::error::downloaded-build directory was not created"
            exit 1
          }

          test -f downloaded-build/index.html || {
            echo "::error::downloaded-build/index.html was not found"
            exit 1
          }

          echo "Downloaded artifact files:"
          find downloaded-build -maxdepth 2 -type f -print

      - name: Verify deployment configuration
        run: |
          test -n "$ARCHIVE_ROOT" || {
            echo "::error::EC2_ARCHIVE_ROOT variable is empty"
            exit 1
          }

          test -n "$STAGING_ROOT" || {
            echo "::error::EC2_STAGING_ROOT variable is empty"
            exit 1
          }

          test -n "$DESTINATION_PATH" || {
            echo "::error::EC2_DESTINATION variable is empty"
            exit 1
          }

          test -n "$BACKUP_ROOT" || {
            echo "::error::EC2_BACKUP_ROOT variable is empty"
            exit 1
          }

          echo "Archive root: $ARCHIVE_ROOT"
          echo "Staging root: $STAGING_ROOT"
          echo "Destination: $DESTINATION_PATH"
          echo "Backup root: $BACKUP_ROOT"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/ec2_key"
          chmod 600 "$HOME/.ssh/ec2_key"

          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Test EC2 connection
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i "$HOME/.ssh/ec2_key" \
            "${EC2_USER}@${EC2_HOST}" \
            "echo 'Connected to EC2 successfully'; hostname; whoami"

      - name: Create deployment archive
        run: |
          tar -czf react-build.tar.gz -C downloaded-build .

          test -s react-build.tar.gz

          tar -tzf react-build.tar.gz > /dev/null

          echo "Deployment archive created successfully"
          ls -lh react-build.tar.gz

      - name: Upload build archive to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp \
            -i "$HOME/.ssh/ec2_key" \
            react-build.tar.gz \
            "${EC2_USER}@${EC2_HOST}:${ARCHIVE_ROOT}/react-build-${GITHUB_SHA}.tar.gz"

      - name: Verify archive on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i "$HOME/.ssh/ec2_key" \
            "${EC2_USER}@${EC2_HOST}" \
            "test -s '${ARCHIVE_ROOT}/react-build-${GITHUB_SHA}.tar.gz' &&
             echo 'Build archive uploaded successfully' &&
             ls -lh '${ARCHIVE_ROOT}/react-build-${GITHUB_SHA}.tar.gz'"

      - name: Deploy build through staging
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i "$HOME/.ssh/ec2_key" \
            "${EC2_USER}@${EC2_HOST}" \
            "DEPLOY_SHA='${GITHUB_SHA}' \
             RUN_ID='${GITHUB_RUN_ID}' \
             RUN_ATTEMPT='${GITHUB_RUN_ATTEMPT}' \
             ARCHIVE_ROOT='${ARCHIVE_ROOT}' \
             STAGING_ROOT='${STAGING_ROOT}' \
             DESTINATION_PATH='${DESTINATION_PATH}' \
             BACKUP_ROOT='${BACKUP_ROOT}' \
             bash -s" <<'REMOTE_SCRIPT'
              set -euo pipefail

              echo "Confirming deployment configuration"

              test -n "$DEPLOY_SHA"
              test -n "$RUN_ID"
              test -n "$RUN_ATTEMPT"
              test -n "$ARCHIVE_ROOT"
              test -n "$STAGING_ROOT"
              test -n "$DESTINATION_PATH"
              test -n "$BACKUP_ROOT"

              ARCHIVE="${ARCHIVE_ROOT}/react-build-${DEPLOY_SHA}.tar.gz"
              STAGING="${STAGING_ROOT}/react-staging-${DEPLOY_SHA}"
              DESTINATION="$DESTINATION_PATH"
              BACKUP="${BACKUP_ROOT}/${RUN_ID}-${RUN_ATTEMPT}"

              echo "Archive: $ARCHIVE"
              echo "Staging: $STAGING"
              echo "Destination: $DESTINATION"
              echo "Backup: $BACKUP"

              echo "Checking uploaded archive"

              test -s "$ARCHIVE"
              tar -tzf "$ARCHIVE" > /dev/null

              echo "Uploaded archive is valid"

              echo "Creating clean staging directory"

              rm -rf "$STAGING"
              mkdir -p "$STAGING"

              test -d "$STAGING"

              echo "Extracting build into staging"

              tar -xzf "$ARCHIVE" -C "$STAGING"

              echo "Verifying staged build"

              test -f "$STAGING/index.html" || {
                echo "ERROR: index.html was not found in staging"
                exit 1
              }

              find "$STAGING" -maxdepth 2 -type f -print

              echo "Checking deployment permissions"

              mkdir -p "$DESTINATION"

              test -w "$DESTINATION" || {
                echo "ERROR: $DESTINATION is not writable by $(whoami)"
                ls -ld "$DESTINATION"
                exit 1
              }

              echo "Creating backup root"

              mkdir -p "$BACKUP_ROOT"

              echo "Backing up current deployment"

              if [ -n "$(find "$DESTINATION" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
                rm -rf "$BACKUP"
                mkdir -p "$BACKUP"
                cp -a "$DESTINATION"/. "$BACKUP"/

                test -f "$BACKUP/index.html" || {
                  echo "ERROR: Backup index.html was not created"
                  exit 1
                }

                echo "Current deployment backed up to $BACKUP"
              else
                echo "Destination is empty; no backup is required"
              fi

              echo "Clearing current deployment"

              find "$DESTINATION" \
                -mindepth 1 \
                -maxdepth 1 \
                -exec rm -rf -- {} +

              echo "Copying staged build into destination"

              cp -a "$STAGING"/. "$DESTINATION"/

              echo "Verifying deployed files"

              test -f "$DESTINATION/index.html" || {
                echo "ERROR: Deployed index.html was not found"
                exit 1
              }

              find "$DESTINATION" -maxdepth 2 -type f -print

              echo "Cleaning temporary deployment files"

              rm -rf "$STAGING"
              rm -f "$ARCHIVE"

              echo "React application deployed successfully"
          REMOTE_SCRIPT

      - name: Validate Nginx deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i "$HOME/.ssh/ec2_key" \
            "${EC2_USER}@${EC2_HOST}" \
            "DESTINATION_PATH='${DESTINATION_PATH}' bash -s" <<'REMOTE_SCRIPT'
              set -euo pipefail

              echo "Verifying deployed index.html"

              test -f "$DESTINATION_PATH/index.html"

              echo "Testing Nginx configuration"

              sudo nginx -t

              echo "Checking Nginx service"

              if ! sudo systemctl is-active --quiet nginx; then
                echo "Nginx is not running; starting it"
                sudo systemctl start nginx
              fi

              echo "Testing application locally"

              STATUS_CODE="$(
                curl \
                  --silent \
                  --show-error \
                  --output /dev/null \
                  --write-out '%{http_code}' \
                  --max-time 15 \
                  http://127.0.0.1/
              )"

              echo "Local HTTP status: $STATUS_CODE"

              test "$STATUS_CODE" = "200" || {
                echo "ERROR: Nginx did not return HTTP 200"
                exit 1
              }

              echo "Nginx deployment verified successfully"
          REMOTE_SCRIPT

      - name: Verify public application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for ATTEMPT in 1 2 3 4 5; do
            STATUS_CODE="$(
              curl \
                --silent \
                --show-error \
                --output /dev/null \
                --write-out '%{http_code}' \
                --max-time 15 \
                "http://${EC2_HOST}/" || true
            )"

            echo "Attempt $ATTEMPT: HTTP $STATUS_CODE"

            if [ "$STATUS_CODE" = "200" ]; then
              echo "Application deployment successful"
              echo "URL: http://${EC2_HOST}/"
              exit 0
            fi

            sleep 5
          done

          echo "::error::Public application verification failed"
          exit 1
