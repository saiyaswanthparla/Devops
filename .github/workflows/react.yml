name: React Application CI/CD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Upload Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Display environment information
        run: |
          pwd
          ls -la
          node --version
          npm --version

      - name: Verify project files
        run: |
          test -f package.json || {
            echo "::error::package.json was not found"
            exit 1
          }

          test -f package-lock.json || {
            echo "::error::package-lock.json was not found"
            exit 1
          }

          echo "Required project files found"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify build output
        run: |
          test -d dist || {
            echo "::error::dist directory was not created"
            exit 1
          }

          test -f dist/index.html || {
            echo "::error::dist/index.html was not created"
            exit 1
          }

          echo "Build output verified successfully"
          find dist -maxdepth 2 -type f -print

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: react-build
          path: dist/
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy Artifact to EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: react-build
          path: downloaded-build

      - name: Verify downloaded artifact
        run: |
          echo "Downloaded files:"
          find downloaded-build -maxdepth 2 -type f -print

          test -f downloaded-build/index.html || {
            echo "::error::Downloaded index.html was not found"
            exit 1
          }

          echo "Artifact download successful"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/ec2_key"
          chmod 600 "$HOME/.ssh/ec2_key"

          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Test EC2 connection
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i "$HOME/.ssh/ec2_key" \
            "${EC2_USER}@${EC2_HOST}" \
            "echo 'Connected to EC2 successfully'; hostname; whoami"

      - name: Create deployment archive
        run: |
          tar -czf react-build.tar.gz -C downloaded-build .

          echo "Deployment archive:"
          ls -lh react-build.tar.gz

          echo "Archive contents:"
          tar -tzf react-build.tar.gz

      - name: Upload build archive to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp \
            -i "$HOME/.ssh/ec2_key" \
            react-build.tar.gz \
            "${EC2_USER}@${EC2_HOST}:/tmp/react-build-${GITHUB_SHA}.tar.gz"

      - name: Verify archive on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i "$HOME/.ssh/ec2_key" \
            "${EC2_USER}@${EC2_HOST}" \
            "test -s /tmp/react-build-${GITHUB_SHA}.tar.gz &&
             echo 'Build archive uploaded successfully' &&
             ls -lh /tmp/react-build-${GITHUB_SHA}.tar.gz"

      - name: Deploy build on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i "$HOME/.ssh/ec2_key" \
            "${EC2_USER}@${EC2_HOST}" \
            "DEPLOY_SHA='${GITHUB_SHA}' RUN_ID='${GITHUB_RUN_ID}' RUN_ATTEMPT='${GITHUB_RUN_ATTEMPT}' bash -s" <<'REMOTE_SCRIPT'
              set -euo pipefail

              ARCHIVE="/tmp/react-build-${DEPLOY_SHA}.tar.gz"
              STAGING="/home/ec2-user/react-staging-${DEPLOY_SHA}"
              DESTINATION="/home/ec2-user/copy"
              BACKUP="/home/ec2-user/deployment-backups/${RUN_ID}-${RUN_ATTEMPT}"

              echo "Checking uploaded archive"
              test -s "$ARCHIVE"

              echo "Creating staging directory"
              rm -rf "$STAGING"
              mkdir -p "$STAGING"

              echo "Extracting build"
              tar -xzf "$ARCHIVE" -C "$STAGING"

              test -f "$STAGING/index.html" || {
                echo "ERROR: index.html was not found"
                exit 1
              }

              echo "Checking deployment permissions"
              mkdir -p "$DESTINATION"

              test -w "$DESTINATION" || {
                echo "ERROR: $DESTINATION is not writable by $(whoami)"
                ls -ld "$DESTINATION"
                exit 1
              }

              echo "Backing up current deployment"
              mkdir -p "/home/ec2-user/deployment-backups"

              if [ -n "$(find "$DESTINATION" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
                rm -rf "$BACKUP"
                cp -a "$DESTINATION" "$BACKUP"
              fi

              echo "Deploying new build"
              find "$DESTINATION" \
                -mindepth 1 \
                -maxdepth 1 \
                -exec rm -rf -- {} +

              cp -a "$STAGING"/. "$DESTINATION"/

              echo "Verifying deployed files"
              test -f "$DESTINATION/index.html"
              find "$DESTINATION" -maxdepth 2 -type f -print

              echo "Cleaning temporary files"
              rm -rf "$STAGING"
              rm -f "$ARCHIVE"

              echo "React application deployed successfully"
          REMOTE_SCRIPT

      - name: Validate Nginx deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i "$HOME/.ssh/ec2_key" \
            "${EC2_USER}@${EC2_HOST}" \
            "bash -s" <<'REMOTE_SCRIPT'
              set -euo pipefail

              echo "Verifying deployed files"
              test -f /home/ec2-user/copy/index.html

              echo "Testing Nginx configuration"
              sudo nginx -t

              echo "Checking Nginx service"
              if ! sudo systemctl is-active --quiet nginx; then
                echo "Nginx is not running. Starting it..."
                sudo systemctl start nginx
              fi

              echo "Reloading Nginx"
              sudo systemctl reload nginx

              echo "Testing application locally"
              STATUS_CODE="$(
                curl \
                  --silent \
                  --output /dev/null \
                  --write-out '%{http_code}' \
                  http://127.0.0.1/
              )"

              echo "Local HTTP status: $STATUS_CODE"

              test "$STATUS_CODE" = "200" || {
                echo "ERROR: Nginx did not return HTTP 200"
                exit 1
              }

              echo "Nginx deployment verified successfully"
          REMOTE_SCRIPT

      - name: Verify public application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for ATTEMPT in 1 2 3 4 5; do
            STATUS_CODE="$(
              curl \
                --silent \
                --output /dev/null \
                --write-out '%{http_code}' \
                --max-time 15 \
                "http://${EC2_HOST}/" || true
            )"

            echo "Attempt $ATTEMPT: HTTP $STATUS_CODE"

            if [ "$STATUS_CODE" = "200" ]; then
              echo "Application deployment successful"
              echo "URL: http://${EC2_HOST}/"
              exit 0
            fi

            sleep 5
          done

          echo "::error::Public application verification failed"
          exit 1
