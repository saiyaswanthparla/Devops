name: React Application Setup
on:
  push:
jobs:
  first-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4  
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: printing test message
        run: echo "Learning GitHub Actions"
      - name: Checking current directory
        run:  pwd
      - name: installing dependencies
        run:  npm ci
      - name: build
        run:  npm run build
        
        
   
