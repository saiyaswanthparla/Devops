name: React Application Setup

on:
 workflow_dispatch: 

jobs:
  first-workflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Debug
        run: |
          pwd
          ls -la
          node -v
          npm -v

      - name: Verify files
        run: |
          ls -la
          test -f package.json && echo "package.json FOUND"
          test -f package-lock.json && echo "package-lock.json FOUND"

      - name: Install dependencies
        run: npm ci
        
      - name: Code Build
        run: npm run build
      
      - name: Verify build output
        run: |
          test -d dist || {
            echo "::error::dist directory was not created"
            exit 1
          }

          test -f dist/index.html || {
            echo "::error::dist/index.html was not created"
            exit 1
          }

          echo "Build output verified successfully"
          find dist -maxdepth 2 -type f -print

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: dist/
          retention-days: 7
          if-no-files-found: error     
  download-artifact:
      name: Download and Verify Artifact
      runs-on: ubuntu-latest
      needs: first-workflow
      steps:
        - name: Download build artifact
          uses: actions/download-artifact@v4
          with:
            name: react-build
            path: downloaded-build
        - name: Verify downloaded artifact
          run: |
            echo "Downloaded files:"
            find downloaded-build -maxdepth 2 -type f -print
            echo "Artifact Download Success"
        - name: Configure SSH
          env:
            SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
            EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          run: |
            mkdir -p "$HOME/.ssh"
            chmod 700 "$HOME/.ssh"
  
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/ec2_key"
            chmod 600 "$HOME/.ssh/ec2_key"
  
            printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
            chmod 600 "$HOME/.ssh/known_hosts"
  
        - name: Test EC2 connection
          env:
            EC2_HOST: ${{ secrets.EC2_HOST }}
            EC2_USER: ${{ secrets.EC2_USER }}
          run: |
            ssh \
              -i "$HOME/.ssh/ec2_key" \
              "${EC2_USER}@${EC2_HOST}" \
              "echo 'Connected to EC2 successfully'; hostname; whoami"
        
