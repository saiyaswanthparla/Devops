name: React Application Setup

on:
 workflow_dispatch: 

jobs:
  first-workflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Debug
        run: |
          pwd
          ls -la
          node -v
          npm -v

      - name: Verify files
        run: |
          ls -la
          test -f package.json && echo "package.json FOUND"
          test -f package-lock.json && echo "package-lock.json FOUND"

      - name: Install dependencies
        run: npm ci
        
      - name: Code Build
        run: npm run build
      
      - name: Verify build output
        run: |
          test -d dist || {
            echo "::error::dist directory was not created"
            exit 1
          }

          test -f dist/index.html || {
            echo "::error::dist/index.html was not created"
            exit 1
          }

          echo "Build output verified successfully"
          find dist -maxdepth 2 -type f -print

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: dist/
          retention-days: 7
          if-no-files-found: error

