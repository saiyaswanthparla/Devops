name: React workflow
on:
  workflow_dispatch: 
jobs:
  basic:
    runs-on: ubuntu-latest
    steps:
     - name: Printing message
       run: echo "Learning Github Actions"
     - name: Checkout repository
       uses: actions/checkout@v7
     - name: Install node.js
       uses: actions/setup-node@v7
       with:
         node-version: 24
     - name: install dependenices
       run : npm ci
     - name: check version
       run : node --version
     - name: build application
       run: npm run build
     - name: Verify index.html and build files
       run : |
         find dist -maxdepth 2 -type f -print
         test -f dist/index.html
     - name: Uploading Artifact
       uses: actions/upload-artifact@v7
       with:
         name: react-files
         path: dist/
         retention-days : 7
         if-no-files-found: error
  deploy:
    runs-on: ubuntu-latest
    needs: basic
    steps:
     - name: Download build artifact
       uses: actions/download-artifact@v7
       with:
         name: react-files
         path: downloaded-build
     - name: Archive files
       run: |
        tar -czf react-files.tar.gz -C downloaded-build .
        tar -tzf react-files.tar.gz   
     - name: Configure SSH
       env:
         SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY}}
         KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS}}
       run: |
         mkdir -p "$HOME/.ssh"
         chmod 700 "$HOME/.ssh"
         printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/ec2_key"
         chmod 600 "$HOME/.ssh/ec2_key"
         printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
         chmod 600 "$HOME/.ssh/known_hosts"
     
     - name: Test Ec2 connection 
       env:
         EC2_HOST: ${{ secrets.EC2_HOST}}
         EC2_USER: ${{ secrets.EC2_USER}}
       run: |
         ssh -i "$HOME/.ssh/ec2_key" "${EC2_USER}@${EC2_HOST}" \
         "hostname; whoami"
     - name: Copy files 
       env:
         EC2_HOST: ${{ secrets.EC2_HOST }}
         EC2_USER: ${{ secrets.EC2_USER }}
       run: |
         scp -i "$HOME/.ssh/ec2_key" react-files.tar.gz \
         "${EC2_USER}@${EC2_HOST}:/tmp/react-files.tar.gz"
         
     - name: Deploy to EC2
       env:
         EC2_HOST: ${{ secrets.EC2_HOST }}
         EC2_USER: ${{ secrets.EC2_USER }}
       run: |
         ssh -i "$HOME/.ssh/ec2_key" "${EC2_USER}@${EC2_HOST}" \
         bash -s <<'REMOTE_SCRIPT'
          set -euo pipefail

            ARCHIVE="${{ vars.EC2_ARCHIVE }}/react-files.tar.gz"
            STAGING="${{ vars.EC2_STAGING }}/react-staging"
            DESTINATION="${{ vars.EC2_DESTINATION }}"
            BACKUP_ROOT="${{ vars.EC2_BACKUP }}"
            BACKUP="$BACKUP_ROOT/${{ github.run_id }}-${{ github.run_attempt }}"
          # Check the uploaded archive
              test -s "$ARCHIVE"
          # Create the STAGING   
              rm -rf "$STAGING"
              mkdir -p "$STAGING"
          # Extract and verify the new build
              tar -xzf "$ARCHIVE" -C "$STAGING"
              test -f "$STAGING/index.html"
          # Prepare the live destination
              mkdir -p "$DESTINATION"
              test -w "$DESTINATION"
          # Extract and verify the new build
              mkdir -p "$BACKUP_ROOT"
              if [ -n "$(find "$DESTINATION" -mindepth 1 -print -quit)" ]; then
              mkdir -p "$BACKUP"
              cp -a "$DESTINATION"/. "$BACKUP"/
            fi
          # Remove the old live application
              find "$DESTINATION" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          # Deploy the staged application
              cp -a "$STAGING"/. "$DESTINATION"/
          # Verify the deployed application
              test -f "$DESTINATION/index.html"
              find "$DESTINATION" -maxdepth 2 -type f -print
          # Remove temporary files
              rm -rf "$STAGING"
              rm -f "$ARCHIVE"
           REMOTE_SCRIPT
