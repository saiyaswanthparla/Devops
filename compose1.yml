services:
  backend:
    image: nginx:alpine
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: .
      args:
        VITE_APP_ENV: ${VITE_APP_ENV}
    depends_on:
      backend:
        condition: service_healthy

    image: react-app:${IMAGE_TAG}
    ports:
      - "${HOST_PORT}:80"
    env_file:
      - app.env
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s     
