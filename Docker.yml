name: Docker with Github Actions
on:
  workflow_dispatch:
jobs:
  Docker:
    runs-on: ubuntu-latest
    steps:
    - name: Learning Docker with Github Actions
      run: echo "Learning Docker with GitHub Actions"
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with: 
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build Docker image
      run: docker build -t saiyaswanthp/myimage:${{ github.sha }}  .
    - name: Push Docker image
      run: docker push saiyaswanthp/myimage:${{ github.sha }}
